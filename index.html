<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Bloom Pest Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout concept: one-hand field tool. Sticky header + scrolling tab strip + shared search bar, then card lists. Full-screen sheets for jobs, customers and invoices. */
:root{
  --bg:#eef3ee; --surface:#ffffff; --surface2:#e6ede6; --ink:#16261e; --muted:#58695f; --line:#d1dcd2;
  --brand:#c40e24; --brand-ink:#ffffff; --brand-soft:#f8dcdf; --logo-bg:#c6c4c5; --logo-ink:#1b1b1b; --logo-line:#cd0e22;
  --up:#2a5fa8; --up-soft:#dce8f7; --inv:#9a5f0a; --inv-soft:#fbebcf; --paid:#1b7547; --paid-soft:#d6efe0; --bad:#b3261e; --bad-soft:#fbdedb;
  --paper:#ffffff; --paper-ink:#1a1a1a; --paper-line:#cfcfcf; --paper-muted:#666666;
  --shadow:0 1px 2px rgba(20,40,30,.08),0 4px 14px rgba(20,40,30,.06);
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Public Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;overflow-x:clip;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--logo-bg)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
button{touch-action:manipulation}
html{-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.wrap{max-width:980px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) ;padding-inline:max(16px,env(safe-area-inset-left,0px));background:var(--logo-bg);color:var(--logo-ink);border-top:3px solid var(--logo-line);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand{flex:none}
.brand img{display:block;height:56px;width:auto;max-width:none;flex:none}
@media(max-width:480px){.brand img{height:44px}.top .btn{padding:8px 10px}}
.top .btn{white-space:nowrap}.top .wrap{gap:8px}@media(max-width:420px){.top .btn{font-size:13px;padding:8px 8px}.brand img{height:38px}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.plogo{display:block;height:84px;width:auto;max-width:none;margin-bottom:8px}
.top .grow{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;min-height:40px}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13px}
.btn.bad{color:var(--bad);border-color:var(--bad)}
:focus-visible{outline:3px solid var(--up);outline-offset:2px}

/* tabs + search */
.nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 75px);z-index:15;background:var(--bg);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:none;border:0;border-bottom:3px solid transparent;padding:12px 14px 9px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}
.tab .ct{display:inline-block;min-width:20px;margin-left:5px;padding:0 6px;border-radius:10px;background:var(--surface2);color:var(--muted);font-size:12px;text-align:center}
.searchrow{padding-block:8px 10px}
.searchrow input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;min-height:44px}

main{padding-top:16px;display:flex;flex-direction:column;gap:18px}
.vhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.vhead h2{font-size:22px}
.vhead p{margin:2px 0 0;color:var(--muted);font-size:13px}
.group h3{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-family:var(--f-body);font-weight:700}
.list{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:var(--shadow)}
.job{display:grid;grid-template-columns:52px 1fr;gap:12px;cursor:pointer;min-width:0}
.job:hover{border-color:var(--brand)}
.dt{width:52px;border-radius:10px;background:var(--surface2);text-align:center;padding:6px 0;line-height:1.1}
.dt span{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.dt b{font-family:var(--f-display);font-size:22px}
.job .mid{min-width:0}
.job .nm{font-weight:700;overflow-wrap:anywhere}
.job .sub{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.job .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.job .amt{margin-left:auto;font-weight:700}
.job .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;background:var(--surface2);color:var(--muted)}
.chip.up{background:var(--up-soft);color:var(--up)} .chip.inv{background:var(--inv-soft);color:var(--inv)}
.chip.paid{background:var(--paid-soft);color:var(--paid)} .chip.bad{background:var(--bad-soft);color:var(--bad)}
.empty{border:1px dashed var(--line);border-radius:12px;padding:28px 16px;text-align:center;color:var(--muted)}
.banner{background:var(--inv-soft);color:var(--inv);border-radius:10px;padding:10px 14px;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner.bad{background:var(--bad-soft);color:var(--bad)}

.tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.tile b{display:block;font-family:var(--f-display);font-size:26px;margin-top:2px}
.tile em{font-style:normal;font-size:12px;color:var(--muted)}
.tile.warn b{color:var(--bad)}

table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td.r,th.r{text-align:right}
tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
.scroll{overflow-x:auto}

/* sheets */
#modal:empty{display:none}
.backdrop{position:fixed;top:0;left:0;right:0;height:100%;height:100dvh;z-index:50;background:rgba(8,16,12,.55);display:flex;justify-content:center;align-items:flex-end}
.sheet{background:var(--bg);width:min(760px,100%);max-height:100%;height:100%;display:flex;flex-direction:column;border-radius:0}
@media(min-width:800px){.backdrop{align-items:center;padding:24px}.sheet{height:auto;max-height:100%;border-radius:16px;overflow:hidden}}
.sheet header{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line)}
@media(min-width:800px){.sheet header{padding-top:12px}}
.sheet header h2{font-size:19px;flex:1;min-width:0;overflow-wrap:anywhere}
.sbody{overflow-y:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;flex:1}
.sfoot{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-top:1px solid var(--line)}
.sfoot .sp{flex:1}
.sheet.kb .sfoot{display:none}
.sfoot-inline{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:4px;padding-bottom:12px}
.sfoot-inline .grow{flex:1 1 120px}
.sfoot-inline .sp{flex:1}
.acwrap{position:relative}
.acpop{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:6;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);max-height:260px;overflow-y:auto}
.acitem{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 12px;min-height:48px;cursor:pointer}
.acitem:last-child{border-bottom:0}
.acitem span{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.acitem:hover,.acitem:focus-visible{background:var(--surface2)}
.sfoot .grow{flex:1 1 120px}
.btn:disabled{opacity:.6;cursor:default}
fieldset{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 14px 14px;margin:0;min-width:0}
legend{font-family:var(--f-display);font-weight:700;padding:0 6px;font-size:15px}
.fg{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.fg .wide{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;font-weight:400;color:var(--ink);min-height:40px;width:100%}
label.f textarea{min-height:76px;resize:vertical}
label.ck{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:500;color:var(--ink)}
label.ck input{width:20px;height:20px;accent-color:var(--brand)}
.lines{display:grid;gap:8px}
.ln{display:grid;grid-template-columns:1fr 64px 92px auto;gap:6px;align-items:end}
.ln .dl{grid-column:1/-1}
.ln .tx{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
@media(max-width:520px){.ln{grid-template-columns:1fr 1fr}.ln label:first-child{grid-column:1/-1}}
.sum{display:flex;justify-content:flex-end;gap:18px;flex-wrap:wrap;font-size:14px;margin-top:8px}
.sum b{font-size:17px}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
.private{border-left:4px solid var(--inv);padding-left:10px}
.photos{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));margin-top:10px}
.ph{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.ph img{display:block;width:100%;height:130px;object-fit:cover;cursor:zoom-in}
.ph .pb{padding:8px;display:grid;gap:6px}
.ph input[type=text]{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 8px;width:100%}
.gps{font-size:11px;color:var(--muted);overflow-wrap:anywhere}
.hist{display:grid;gap:8px}
.hist div.hphotos{border:0;padding:0;background:none;cursor:default;display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.hphotos img{width:68px;height:68px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
.hist div{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface);cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:80;font-weight:600;max-width:90%}

/* invoice paper */
.paper{background:var(--paper);color:var(--paper-ink);border:1px solid var(--paper-line);border-radius:6px;padding:22px;font-size:14px}
.paper h2{font-size:26px}
.paper .ih{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:3px solid var(--paper-ink);padding-bottom:12px}
.paper .meta{text-align:right;font-size:13px}
.paper .meta b{font-family:var(--f-display);font-size:20px;display:block}
@media(max-width:520px){.paper .meta{text-align:left}}
.paper .two{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:14px 0}
.paper .lbl{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--paper-muted);font-weight:700}
.paper th,.paper td{border-bottom:1px solid var(--paper-line);color:var(--paper-ink)}
.paper th{color:var(--paper-muted)}
.paper tr.tot td{border-top:2px solid var(--paper-ink)}
.paper .tr{margin-top:14px;padding:10px 12px;border:1px solid var(--paper-line);border-radius:6px;font-size:13px}
.paper .foot{margin-top:16px;font-size:12px;color:var(--paper-muted)}
.paper .pp{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.paper .pp img{width:100%;height:110px;object-fit:cover;border:1px solid var(--paper-line)}
.paper .pp span{font-size:11px;color:var(--paper-muted)}
.paid-stamp{display:inline-block;border:3px solid var(--paid);color:var(--paid);border-radius:6px;padding:2px 12px;font-family:var(--f-display);font-weight:700;letter-spacing:.1em;transform:rotate(-4deg);margin-top:6px}
.lightbox{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%}
@media print{
  body::before,#app{display:none!important}
  body{background:#fff;padding:0}
  .backdrop{position:static;background:none;display:block;padding:0}
  .sheet{width:100%;height:auto;max-height:none;background:#fff;border-radius:0}
  .sheet header,.sfoot,.no-print{display:none!important}
  .sbody{overflow:visible;padding:0}
  .paper{border:0;padding:0}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

/* ---------- EXIF (GPS + date) ---------- */
function exifRead(buf){try{const v=new DataView(buf);if(v.getUint16(0)!==0xFFD8)return{};let o=2;
 while(o<v.byteLength-10){const m=v.getUint16(o),len=v.getUint16(o+2);
  if(m===0xFFE1&&v.getUint32(o+4)===0x45786966)return tiff(v,o+10);
  if((m&0xFF00)!==0xFF00)break;o+=2+len}}catch(e){}return{}}
function tiff(v,t){const le=v.getUint16(t)===0x4949;const u16=o=>v.getUint16(o,le),u32=o=>v.getUint32(o,le);
 const ents=off=>{const n=u16(off),r=[];for(let i=0;i<n;i++){const e=off+2+i*12;r.push({tag:u16(e),cnt:u32(e+4),val:e+8})}return r};
 const rat=o=>u32(o)/(u32(o+4)||1);const out={};let gps=0,ex=0;
 for(const e of ents(t+u32(t+4))){if(e.tag===0x8825)gps=t+u32(e.val);if(e.tag===0x8769)ex=t+u32(e.val)}
 if(gps){let la='N',lo='E',lat=null,lon=null;
  for(const e of ents(gps)){const d=t+u32(e.val);
   if(e.tag===1)la=String.fromCharCode(v.getUint8(e.val));if(e.tag===3)lo=String.fromCharCode(v.getUint8(e.val));
   if(e.tag===2)lat=rat(d)+rat(d+8)/60+rat(d+16)/3600;if(e.tag===4)lon=rat(d)+rat(d+8)/60+rat(d+16)/3600}
  if(lat!=null&&lon!=null&&(lat||lon)){out.lat=la==='S'?-lat:lat;out.lon=lo==='W'?-lon:lon}}
 if(ex){for(const e of ents(ex)){if(e.tag===0x9003){const d=t+u32(e.val);let s='';for(let i=0;i<19;i++)s+=String.fromCharCode(v.getUint8(d+i));
  const m=s.match(/^(\d{4}):(\d\d):(\d\d) (\d\d):(\d\d)/);if(m)out.at=m[1]+'-'+m[2]+'-'+m[3]+' '+m[4]+':'+m[5]}}}
 return out}
function shrink(file,max){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),im=new Image();
 im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.82))};
 im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('bad image'))};im.src=url})}

async function buildPdf(j){
 const lib=window.jspdf&&window.jspdf.jsPDF;if(!lib)throw new Error('PDF library not loaded');
 const c=cust(j.customerId)||{name:'',address:'',phone:''},s=S.settings,t=totals(j),tr=j.treatment||{};
 const doc=new lib({unit:'pt',format:'letter'});
 const W=612,H=792,M=44,R=W-M,BOT=H-56;let y=0;
 const ink=()=>doc.setTextColor(26,26,26),grey=()=>doc.setTextColor(100,100,100);
 const need=h=>{if(y+h>BOT){doc.addPage();y=M}};
 const wrap=(txt,w)=>doc.splitTextToSize(String(txt==null?'':txt),w);
 const label=(txt,x,yy)=>{doc.setFont('helvetica','bold');doc.setFontSize(8);grey();doc.text(String(txt).toUpperCase(),x,yy)};
 doc.setFillColor(198,196,197);doc.rect(0,0,W,98,'F');doc.setFillColor(205,14,34);doc.rect(0,0,W,5,'F');
 try{doc.addImage(LOGO,'JPEG',M,14,190,76)}catch(e){}
 ink();doc.setFont('helvetica','bold');doc.setFontSize(24);doc.text('INVOICE',R,48,{align:'right'});
 doc.setFontSize(12);doc.text(j.invNo||'(draft)',R,68,{align:'right'});
 y=126;const top=y;
 doc.setFont('helvetica','bold');doc.setFontSize(12);ink();doc.text(s.bizName||'',M,y);y+=15;
 doc.setFont('helvetica','normal');doc.setFontSize(10);
 [s.address,[s.phone,s.email].filter(Boolean).join('  |  '),s.license?'Applicator license '+s.license:''].filter(Boolean).forEach(l=>{wrap(l,300).forEach(x=>{doc.text(x,M,y);y+=13})});
 let ry=top;doc.setFontSize(10);
 [['Invoice date',fmtDate(j.invDate||today())],j.status==='paid'?['Paid',fmtDate(j.paidDate)]:['Due',fmtDate(j.dueDate||addDays(j.invDate||today(),num(s.dueDays)))]].forEach(p=>{doc.setFont('helvetica','normal');grey();doc.text(p[0],R-120,ry);ink();doc.setFont('helvetica','bold');doc.text(p[1],R,ry,{align:'right'});ry+=14});
 if(j.status==='paid'){doc.setDrawColor(27,117,71);doc.setLineWidth(1.6);doc.setTextColor(27,117,71);doc.setFont('helvetica','bold');doc.setFontSize(14);doc.roundedRect(R-70,ry+2,70,24,3,3,'S');doc.text('PAID',R-35,ry+19,{align:'center'});ry+=28;ink()}
 y=Math.max(y,ry)+18;
 label('Bill to',M,y);y+=14;
 doc.setFontSize(11);doc.setFont('helvetica','bold');ink();doc.text(c.name||'',M,y);
 doc.setFont('helvetica','normal');
 let ly=y+14,ry2=y+14;doc.setFontSize(10);
 addrLines(c).forEach(l=>wrap(l,240).forEach(x=>{doc.text(x,M,ly);ly+=13}));if(c.phone){doc.text(c.phone,M,ly);ly+=13}
  y=Math.max(ly,ry2)+14;
 const cQ=R-190,cP=R-100,cA=R;
 doc.setDrawColor(26,26,26);doc.setLineWidth(1.5);doc.line(M,y,R,y);y+=14;
 label('Description',M,y);
 doc.setFont('helvetica','bold');doc.setFontSize(8);grey();doc.text('QTY',cQ,y,{align:'right'});doc.text('PRICE',cP,y,{align:'right'});doc.text('AMOUNT',cA,y,{align:'right'});
 y+=6;doc.setDrawColor(200,200,200);doc.setLineWidth(.7);doc.line(M,y,R,y);y+=15;
 doc.setFontSize(10);
 j.lines.forEach(l=>{const d=wrap(l.desc,cQ-M-50);const h=d.length*13+6;need(h);
  doc.setFont('helvetica','normal');ink();d.forEach((x,i)=>doc.text(x,M,y+i*13));
  doc.text(String(num(l.qty)),cQ,y,{align:'right'});doc.text(money(num(l.rate)),cP,y,{align:'right'});doc.text(money(num(l.qty)*num(l.rate)),cA,y,{align:'right'});
  y+=h-2;doc.setDrawColor(225,225,225);doc.line(M,y,R,y);y+=13});
 need(70);y+=2;
 const tl=(a,b,bold)=>{doc.setFont('helvetica',bold?'bold':'normal');doc.setFontSize(bold?12:10);ink();doc.text(a,cP-30,y,{align:'right'});doc.text(b,cA,y,{align:'right'});y+=bold?18:14};
 tl('Subtotal',money(t.sub));if(t.tax)tl('Sales tax',money(t.tax));
 doc.setDrawColor(26,26,26);doc.setLineWidth(1.2);doc.line(cP-110,y-8,R,y-8);y+=4;tl(j.status==='paid'?'Total paid':'Total due',money(t.total),true);
 y+=8;
 const box=(title,rows)=>{const lines=[];rows.forEach(r=>{wrap(r,R-M-24).forEach(x=>lines.push(x))});const h=lines.length*13+30;need(h+8);
  doc.setDrawColor(200,200,200);doc.setLineWidth(.8);doc.roundedRect(M,y,R-M,h,4,4,'S');label(title,M+12,y+16);doc.setFont('helvetica','normal');doc.setFontSize(10);ink();lines.forEach((x,i)=>doc.text(x,M+12,y+32+i*13));y+=h+12};
 const hasT=j.showTreat&&[tr.pests,tr.product,tr.epa,tr.amount,tr.method,tr.areas].some(Boolean);
 if(hasT)box('Treatment record',[['Pests targeted',tr.pests],['Product',tr.product],['EPA reg. no.',tr.epa],['Amount applied',tr.amount],['Method',tr.method],['Areas treated',tr.areas]].filter(x=>x[1]).map(x=>x[0]+': '+x[1]));
 if(j.invNotes)box('Notes',String(j.invNotes).split('\n'));
 const pp=photosOf(j.id).filter(p=>p.onInvoice);
 if(pp.length){need(40);label('Photos',M,y);y+=10;const cw=(R-M-14)/2;
  const imgs=[];for(const p of pp){const o=await pdfImg(p.data,1100,.78);if(o)imgs.push({o,cap:p.caption||''})}
  for(let i=0;i<imgs.length;i+=2){const row=imgs.slice(i,i+2).map(x=>{const sc=Math.min(cw/x.o.w,200/x.o.h);return{x,w:x.o.w*sc,h:x.o.h*sc,cap:wrap(x.cap,cw)}});
   const rh=Math.max(...row.map(r=>r.h+(r.cap.length?r.cap.length*10+4:0)))+10;need(rh);
   row.forEach((r,k)=>{const x=M+k*(cw+14);doc.addImage(r.x.o.d,'JPEG',x,y,r.w,r.h);if(r.cap.length){doc.setFont('helvetica','normal');doc.setFontSize(8);grey();r.cap.forEach((l,n)=>doc.text(l,x,y+r.h+10+n*10))}});y+=rh}}
 const tail=wrap(s.terms||'',R-M),foot=wrap(s.footer||'',R-M);
 need(tail.length*12+foot.length*12+18);y+=6;
 doc.setFont('helvetica','normal');doc.setFontSize(9);grey();tail.forEach(x=>{doc.text(x,M,y);y+=12});y+=4;foot.forEach(x=>{doc.text(x,M,y);y+=12});
 const n=doc.getNumberOfPages();
 for(let i=1;i<=n;i++){doc.setPage(i);doc.setFont('helvetica','normal');doc.setFontSize(8);grey();doc.text((s.bizName||'')+'  |  Invoice '+(j.invNo||''),M,H-28);doc.text('Page '+i+' of '+n,R,H-28,{align:'right'})}
 return doc.output('blob')}
let PDF={id:'',file:null,err:false};
function setShareBtn(){const b=document.getElementById('btn-share');if(!b)return;b.disabled=!PDF.file&&!PDF.err;b.textContent=(PDF.file||PDF.err)?'Share PDF':'Preparing PDF…'}
function prepPdf(j){const id=j.id;PDF={id,file:null,err:false};setShareBtn();
 const go=(tries)=>buildPdf(j).then(b=>{if(PDF.id!==id)return;PDF.file=new File([b],pdfName(j),{type:'application/pdf'});setShareBtn()}).catch(e=>{if(PDF.id!==id)return;if(tries>0){setTimeout(()=>go(tries-1),1200);return}PDF.err=true;setShareBtn()});
 go(4)}
async function saveBlob(name,blob){
 try{if(window.claude&&claude.use){const d=await claude.use('downloads');if(d){await d.save({filename:name,data:blob});return true}}}catch(e){if(e&&e.code==='declined')return false}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);return true}
function payDlg(id){const j=job(id);if(!j)return;
 openModal(`<div class="backdrop" style="align-items:center;padding:16px"><div class="sheet" style="height:auto;border-radius:16px;overflow:hidden" role="dialog" aria-label="Mark paid"><header><h2>Mark ${esc(j.invNo)} paid</h2><button class="btn sm" data-act="closeModal">Cancel</button></header>
 <div class="sbody"><div class="fg"><label class="f">Paid on<input type="date" id="pd-date" value="${today()}"></label><label class="f">Paid by<select id="pd-m">${PAY.map(p=>`<option>${p}</option>`).join('')}</select></label></div><div>${esc(cname(j))} · <b class="num">${money(totals(j).total)}</b></div></div>
 <div class="sfoot"><button class="btn pri" data-act="savePaid" data-id="${id}">Save payment</button></div></div></div>`)}

/* ---------- events ---------- */
const acts={
 tab(el){S.tab=el.dataset.id;q='';$('#q').value='';persist();render();scrollTo(0,0)},
 newJob(){openJob(null)},
 newInv(){D=blankJob();DNEW=true;DM='inv';D._prevType=D.type;renderJob()},
 newJobFor(el){closeModal();openJob(null,el.dataset.id)},
 openJob(el){closeModal();openJob(el.dataset.id)},
 closeJob(){if(DNEW){photosOf(D.id).forEach(p=>idbDel(p.id));P=P.filter(p=>p.jobId!==D.id)}closeModal()},
 closeModal(){closeModal()},
 saveJob(){const j=saveJob(false);if(j){closeModal();toast(DNEW?'Job scheduled':'Job saved');render()}},
 saveInvJob(){const j=saveJob(true);if(j){closeModal();render();openInvoice(j.id)}},
 schedInv(){const j=saveJob(false);if(j){closeModal();render();openJob(j.id,null,'inv')}},
 toSched(){const j=saveJob(false);if(j){closeModal();render();openJob(j.id,null,'sched')}},
 schedJob(el){closeModal();openJob(el.dataset.id,null,'sched')},
 invEdit(el){closeModal();openJob(el.dataset.id,null,'inv')},
 delJob(el){if(!arm(el,'Tap again to delete'))return;const id=D.id;photosOf(id).forEach(p=>idbDel(p.id));P=P.filter(p=>p.jobId!==id);S.jobs=S.jobs.filter(j=>j.id!==id);persist();closeModal();render();toast('Job deleted')},
 invoiceJob(el){const j=job(el.dataset.id);j.status='invoiced';assignInv(j);persist();render();openInvoice(j.id)},
 viewInv(el){openInvoice(el.dataset.id)},
 payDlg(el){payDlg(el.dataset.id)},
 savePaid(el){const j=job(el.dataset.id);j.status='paid';j.paidDate=$('#pd-date').value||today();j.payMethod=$('#pd-m').value;persist();closeModal();render();toast('Marked paid')},
 pickCust(el){const c=cust(el.dataset.id);if(!c||!D)return;D.custName=c.name;const i=$('#f-cust');if(i)i.value=c.name;setSiteAddr(c);$('#newbox').hidden=true;hideCustPop();refreshTotals()},
 printInv(){try{window.print()}catch(e){}},
 async sharePdf(el){const j=job(el.dataset.id);if(!j)return;
  if(PDF.err||!PDF.file){if(PDF.err){toast('Could not build the PDF. Check your connection and try again.');prepPdf(j)}return}
  const f=PDF.file;
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:f.name});return}}catch(e){if(e&&e.name==='AbortError')return}
  if(await saveBlob(f.name,f))toast('PDF saved')},
 copyInv(el){copyText(invText(job(el.dataset.id)))},
 addLine(){const t=svcTypes()[0];D.lines.push(t?{id:uid(),desc:t.name,qty:1,rate:t.rate,tax:true,_o:false}:{id:uid(),desc:'',qty:1,rate:'',tax:true,_o:true});renderJob()},
 delLine(el){D.lines.splice(+el.dataset.id,1);renderJob()},
 delPhoto(el){const id=el.dataset.id;P=P.filter(p=>p.id!==id);idbDel(id);renderJob()},
 viewPhoto(el){const p=P.find(p=>p.id===el.dataset.id);if(!p)return;const d=document.createElement('div');d.className='lightbox';d.innerHTML=`<img src="${p.data}" alt="">`;d.onclick=()=>d.remove();document.body.appendChild(d)},
 async useLoc(){toast('Getting location…');const p=await devicePos();if(p){D.loc={lat:p.lat,lon:p.lon,src:'device'};renderJob()}else toast('Location not available here. Photos with GPS also fill this in.')},
 newCust(){openCust(null)},
 openCust(el){closeModal();openCust(el.dataset.id)},
 saveCust(el){const name=capWords($('#cu-name').value.trim());if(!name){toast('Enter a name');return}
  const dup=S.customers.find(c=>c.name.toLowerCase()===name.toLowerCase()&&c.id!==el.dataset.id);if(dup){toast('A customer with that name already exists');return}
  let c=el.dataset.id?cust(el.dataset.id):null;const isNew=!c;if(isNew)c={id:uid()};
  const ad={street:$('#cu-street').value.trim(),city:$('#cu-city').value.trim(),state:$('#cu-state').value.trim(),zip:$('#cu-zip').value.trim()};
  Object.assign(c,{name,kind:$('#cu-kind').value,phone:fmtPhoneSave($('#cu-phone').value),email:$('#cu-email').value,street:ad.street,city:ad.city,state:ad.state,zip:ad.zip,address:composeAddr(ad),notes:$('#cu-notes').value,taxExempt:$('#cu-tx').checked,defaultType:$('#cu-svc').value});
  if(isNew)S.customers.push(c);persist();closeModal();render();toast('Customer saved')},
 delCust(el){const id=el.dataset.id;if(S.jobs.some(j=>j.customerId===id)){toast('This customer has jobs. Delete or move those jobs first.');return}if(!arm(el,'Tap again to delete'))return;S.customers=S.customers.filter(c=>c.id!==id);persist();closeModal();render()},
 taxYear(el){},
 addExp(){const a=num($('#xa').value);if(!a){toast('Enter an amount');return}S.expenses.push({id:uid(),date:$('#xd').value||today(),cat:$('#xc').value,amount:a,note:$('#xn').value});persist();render();toast('Expense added')},
 delExp(el){S.expenses=S.expenses.filter(e=>e.id!==el.dataset.id);persist();render()},
 csvJobs(){const Y=String(taxYear);const rows=[['Service date','Customer','Type','Address','Status','Invoice #','Invoice date','Paid date','Pay method','Subtotal','Sales tax','Total','Chemicals','Other cost','Pests','Product','EPA reg no','GPS lat','GPS lon']];
  S.jobs.filter(j=>j.date.startsWith(Y)).sort((a,b)=>a.date.localeCompare(b.date)).forEach(j=>{const t=totals(j),k=j.costs||{},tr=j.treatment||{};rows.push([j.date,cname(j),j.type,j.address,j.status,j.invNo,j.invDate,j.paidDate,j.payMethod,t.sub.toFixed(2),t.tax.toFixed(2),t.total.toFixed(2),num(k.chem).toFixed(2),num(k.other).toFixed(2),tr.pests,tr.product,tr.epa,j.loc?j.loc.lat:'',j.loc?j.loc.lon:''])});
  saveFile(`bloom-jobs-${Y}.csv`,csv(rows),'text/csv')},
 csvExp(){const Y=String(taxYear);saveFile(`bloom-expenses-${Y}.csv`,csv([['Date','Category','Amount','Note'],...S.expenses.filter(e=>e.date.startsWith(Y)).map(e=>[e.date,e.cat,num(e.amount).toFixed(2),e.note])]),'text/csv')},
 jtAdd(){S.settings.jobTypes.push({name:'New service',rate:0});persist();render()},
 jtDel(el){S.settings.jobTypes.splice(+el.dataset.id,1);persist();render()},
 backup(){const name='Bloom-Pest-Backup-'+today()+'.html';const f=new File([backupHtml()],name,{type:'text/html'});
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:name}).catch(()=>{});return}}catch(e){}
  saveBlob(name,f).then(ok=>{if(ok)toast('Backup saved')})},
 clearSample(){S.customers=[];S.jobs=[];S.expenses=[];S.nextInv=1;S.sample=false;P.forEach(p=>idbDel(p.id));P=[];persist();render();toast('Example data cleared')},
 resetAll(el){if(!arm(el,'Tap again to erase everything'))return;idbClear();P=[];S=defaults();S.tab='upcoming';persist();render();toast('All data erased')}
};
function arm(el,label){if(el.dataset.armed){return true}el.dataset.armed='1';const o=el.textContent;el.textContent=label;setTimeout(()=>{if(el.isConnected){delete el.dataset.armed;el.textContent=o}},3500);return false}
document.addEventListener('click',e=>{if(!e.target.closest('.acwrap'))hideCustPop();const el=e.target.closest('[data-act]');if(!el)return;if(el.tagName==='SELECT')return;const f=acts[el.dataset.act];if(f){e.preventDefault();f(el)}});
function setPath(o,p,v){const a=p.split('.');while(a.length>1)o=o[a.shift()];o[a[0]]=v}
function onField(e){const t=e.target;
 if(e.type==='input'){if(t.id==='cu-phone'||t.dataset.f==='newPhone'||t.dataset.s==='phone'){const v=fmtPhoneLive(t.value);if(v!==t.value)t.value=v}else if(t.id==='cu-state'){const v=t.value.toUpperCase().replace(/[^A-Z]/g,'');if(v!==t.value)t.value=v}}
 if(t.id==='q'){q=t.value;render();return}
 if(t.id==='taxYear'){taxYear=+t.value;render();return}
 if(t.dataset.s){const k=t.dataset.s;S.settings[k]=t.type==='number'?num(t.value):t.value;persist();return}
 if(t.dataset.sc){S.settings[t.dataset.sc]=t.checked;persist();if(e.type==='change')render();return}
 if(t.dataset.jt!==undefined){const jt=S.settings.jobTypes[+t.dataset.jt];jt[t.dataset.k]=t.dataset.k==='rate'?num(t.value):t.value;persist();return}
 if(t.id==='restore'&&e.type==='change'){restore(t.files[0]);return}
 if(!D)return;
 if(t.dataset.pc){const p=P.find(p=>p.id===t.dataset.pc);if(p){p.caption=t.value;if(e.type==='change')idbPut(p)}return}
 if(t.dataset.pi){const p=P.find(p=>p.id===t.dataset.pi);if(p){p.onInvoice=t.checked;idbPut(p)}return}
 if(t.id==='cam'||t.id==='lib'){if(e.type==='change')addPhotos(t.files,t.id==='cam');return}
 if(t.dataset.f!==undefined){const k=t.dataset.f;setPath(D,k,t.type==='checkbox'?t.checked:t.value);
  if(k==='custName'){const c=matchCust(D.custName);$('#newbox').hidden=!!c;if(c)setSiteAddr(c);if(e.type==='input')showCustPop();refreshTotals()}
  else if(k==='type'&&e.type==='change'){D._typeSet=true;syncLines();D._prevType=D.type;renderJob()}
  else if(k==='status'){renderJob()}
  else refreshTotals();return}
 if(t.dataset.t){D.treatment[t.dataset.t]=t.value;return}
 if(t.dataset.c){D.costs[t.dataset.c]=t.value;return}
  if(t.dataset.l!==undefined&&t.dataset.k==='sel'){if(e.type!=='change')return;const l=D.lines[+t.dataset.l];if(t.value==='__other'){l._o=true;l.desc='';l.rate=''}else{const st=svcTypes().find(x=>x.name===t.value);l._o=false;l.desc=t.value;l.rate=st?st.rate:''}renderJob();return}
  if(t.dataset.l!==undefined){const l=D.lines[+t.dataset.l];l[t.dataset.k]=t.type==='checkbox'?t.checked:t.value;refreshTotals()}}
let kbT=null,ptrDown=false;
function syncKb(){const sh=document.querySelector('#modal .sheet');if(!sh)return;const a=document.activeElement;
 const typing=!!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&!/^(checkbox|radio|file|button|submit)$/.test(a.type||'')&&sh.contains(a));
 if(typing){sh.classList.add('kb');if(!sh.querySelector('.sfoot-inline')){const f=sh.querySelector('.sfoot');if(f){const c=f.cloneNode(true);c.className='sfoot-inline';c.querySelectorAll('[id]').forEach(x=>x.removeAttribute('id'));const b=sh.querySelector('.sbody');if(b)b.appendChild(c)}}}
 else if(!ptrDown){sh.classList.remove('kb');const c=sh.querySelector('.sfoot-inline');if(c)c.remove()}}
document.addEventListener('focusin',()=>{clearTimeout(kbT);syncKb()});
document.addEventListener('focusout',()=>{clearTimeout(kbT);kbT=setTimeout(syncKb,250)});
document.addEventListener('pointerdown',e=>{ptrDown=!!e.target.closest('.sfoot-inline')},true);
document.addEventListener('pointerup',()=>{if(ptrDown)setTimeout(()=>{ptrDown=false;syncKb()},500)},true);
document.addEventListener('focusin',e=>{if(e.target.id==='f-cust')showCustPop()});
function capWords(s){return String(s||'').replace(/(^|\s)([a-z])/g,(m,a,b)=>a+b.toUpperCase())}
document.addEventListener('input',e=>{const t=e.target;if(!t||(t.id!=='cu-name'&&t.id!=='f-cust'))return;const v=capWords(t.value);if(v!==t.value){const a=t.selectionStart,b=t.selectionEnd;t.value=v;try{t.setSelectionRange(a,b)}catch(x){}}});
document.addEventListener('input',onField);document.addEventListener('change',onField);
async function addPhotos(files,fromCam){if(!files||!files.length)return;let n=0;
 for(const f of Array.from(files)){try{const buf=await f.arrayBuffer();const ex=exifRead(buf);const data=await shrink(f,1600);
  const p={id:uid(),jobId:D.id,data,caption:'',onInvoice:false,at:ex.at||'',lat:null,lon:null,src:''};
  if(ex.lat!=null){p.lat=ex.lat;p.lon=ex.lon;p.src='photo'}
  else if(fromCam&&S.settings.tagLocation){const g=await devicePos();if(g){p.lat=g.lat;p.lon=g.lon;p.src='device'}}
  if(!p.at)p.at=ymd(new Date())+' '+pad(new Date().getHours())+':'+pad(new Date().getMinutes());
  if(p.lat!=null&&!D.loc)D.loc={lat:p.lat,lon:p.lon,src:p.src};
  P.push(p);idbPut(p);n++}catch(e){toast('Could not read that image')}}
 if(n)renderJob()}
function restore(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=parseBackup(r.result);if(!o.data||!o.data.jobs)throw 0;
 const d=defaults();o.data.settings=Object.assign(d.settings,o.data.settings);S=o.data;idbClear();P=o.photos||[];P.forEach(idbPut);persist();render();toast('Backup restored')}catch(e){toast('That file is not a Bloom backup')}};r.readAsText(f)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal').innerHTML&&!$('.lightbox')){if(D)acts.closeJob();else closeModal()}});

/* ---------- boot ---------- */
render();
openIDB().then(db=>{idb=db;return idbAll()}).then(p=>{P=p;render()});
})();
